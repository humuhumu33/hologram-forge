name: pages

# Forge moved to https://uor-foundation.github.io/foundry/ (repository UOR-Foundation/foundry). This site now
# serves one page that says so and lets a visitor export the apps their browser saved here (moved/index.html,
# also served as 404.html so every old address finds it), plus a service worker that retires Forge's own
# (moved/sw.js). Forge's sources stay in this repository; they are no longer deployed from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The moved page, served for every address of the old site
        run: |
          mkdir -p site
          cp moved/index.html moved/sw.js site/
          cp moved/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
